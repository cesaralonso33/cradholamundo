                        "email": {
                          "type": "string"
                        },
                        "two_factor_enabled": {
                          "type": "boolean"
                        },
                        "permissions": {
                          "type": "array",
                          "items": {
                            "type": "string"
                          }
                        }
                      },
                      "required": [
                        "id",
                        "username",
                        "role",
                        "two_factor_enabled",
                        "permissions"
                      ]
                    }
                  },
                  "required": [
                    "token",
