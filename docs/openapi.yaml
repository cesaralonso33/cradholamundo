    "/api/auth/register": {
      "post": {
        "summary": "Register a user",
        "description": "Authentication/access: JWT + users permission.",
        "security": [
          {
            "bearerAuth": []
          },
          {
            "cookieAuth": []
          },
          {
            "apiKey": []
          }
        ],
        "xAccess": {
          "permission": "users"
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "description": "username,password,email?",
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  },
                  "email": {
                    "type": "string"
                  }
                },
                "required": [
                  "username",
                  "password"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "token": {
                      "type": "string"
                    },
                    "user": {
                      "type": "object",
                      "properties": {
                        "id": {
                          "type": "string"
                        },
                        "username": {
                          "type": "string"
                        },
                        "role": {
                          "type": "string"
                        },
                        "email": {
                          "type": "string"
                        },
                        "two_factor_enabled": {
                          "type": "boolean"
                        },
                        "permissions": {
                          "type": "array",
                          "items": {
                            "type": "string"
                          }
                        }
                      },
                      "required": [
                        "id",
                        "username",
                        "role",
                        "two_factor_enabled",
                        "permissions"
                      ]
                    }
                  },
                  "required": [
                    "token",
                    "user"
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Invalid request body or parameters",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid authentication credentials",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Authenticated caller lacks the required role or permission",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Resource conflicts with existing data",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/auth/login": {
      "post": {
        "summary": "Authenticate and issue JWT/cookie",
        "description": "Authentication/access: Public.",
        "xAccess": {
          "public": true
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "description": "username,password",
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  }
                },
                "required": [
                  "username",
                  "password"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "oneOf": [
                    {
                      "type": "object",
                      "properties": {
                        "token": {
                          "type": "string"
                        },
                        "user": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "username": {
                              "type": "string"
                            },
                            "role": {
                              "type": "string"
                            },
                            "email": {
                              "type": "string"
                            },
                            "two_factor_enabled": {
                              "type": "boolean"
                            },
                            "permissions": {
                              "type": "array",
                              "items": {
                                "type": "string"
                              }
                            }
                          },
                          "required": [
                            "id",
                            "username",
                            "role",
                            "two_factor_enabled",
                            "permissions"
                          ]
                        }
                      },
                      "required": [
                        "token",
                        "user"
                      ]
                    },
                    {
                      "type": "object",
                      "properties": {
                        "requires2fa": {
                          "type": "boolean",
                          "const": true
                        },
                        "tempToken": {
                          "type": "string"
                        },
                        "user": {
                          "type": "object",
                          "properties": {
                            "id": {
                              "type": "string"
                            },
                            "username": {
                              "type": "string"
                            },
                            "role": {
                              "type": "string"
                            }
                          },
                          "required": [
                            "id",
                            "username",
                            "role"
                          ]
                        }
                      },
                      "required": [
                        "requires2fa",
                        "tempToken",
                        "user"
                      ]
                    }
                  ]
                }
              }
            }
          },
          "400": {
            "description": "Invalid request body or parameters",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Resource conflicts with existing data",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Login attempts are temporarily blocked",
            "headers": {
              "Retry-After": {
                "description": "Seconds until another attempt is allowed",
                "schema": {
                  "type": "integer"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "type": "string"
                    },
                    "retry_after_seconds": {
                      "type": "integer"
                    },
                    "blocked_until": {
                      "type": "string"
                    }
                  },
                  "required": [
                    "error",
                    "retry_after_seconds"
                  ]
                }
              }
            }
          }
        }
      }
    },
    "/api/auth/2fa/complete": {
      "post": {
        "summary": "Complete two-factor login",
