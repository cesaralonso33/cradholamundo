services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env para PostgreSQL existente}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-4}
      LOGIN_BLOCK_MINUTES: ${LOGIN_BLOCK_MINUTES:-15}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:55896}
      PORT: 3000
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-55896}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  uploads:
